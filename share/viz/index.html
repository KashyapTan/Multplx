<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="mx-viz-poll-ms" content="__MX_VIZ_POLL_MS__">
  <title>Multplx Live View</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span id="live-dot" class="brand-dot" aria-hidden="true"></span>
        <span class="brand-name">MULTPLX</span>
        <span id="clock" class="brand-meta">·</span>
        <span class="brand-tag">read-only</span>
      </div>
      <div class="topbar-right">
        <span id="connection-note" class="connection-note">Connecting…</span>
        <button id="doctor-button" class="ghost-btn" type="button" hidden>Run doctor</button>
      </div>
    </header>

    <main class="layout">
      <div class="main-col">
        <section class="panel" aria-labelledby="tree-title">
          <div class="panel-head">
            <div class="panel-head-left">
              <span class="eyebrow">Agent tree</span>
              <h1 id="tree-title">Maintainer → broker → workers</h1>
            </div>
            <span id="actor-count" class="panel-head-meta">0 active</span>
          </div>

          <div id="tree-stage" class="tree-stage">
            <svg id="connectors" class="connectors" aria-hidden="true"></svg>

            <div class="row row-root">
              <button id="maintainer-node" class="node root-node" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="decision-drawer">
                <span id="decision-badge" class="attention-badge" hidden>0</span>
                <span class="node-eyebrow">maintainer</span>
                <strong class="node-title">YOU</strong>
                <span id="maintainer-summary" class="node-sub">no decisions pending</span>
              </button>
            </div>

            <div class="row row-broker">
              <div id="broker-node" class="node broker-node">
                <div class="broker-title-row">
                  <div>
                    <div class="node-eyebrow">broker</div>
                    <div class="node-title">multplx-broker</div>
                  </div>
                  <span id="snapshot-age" class="snapshot-age">snapshot pending</span>
                </div>
                <div id="broker-stats" class="broker-stats"></div>
              </div>
            </div>

            <div id="actors-row" class="row row-actors"></div>

            <aside id="decision-drawer" class="decision-drawer" aria-label="Decisions waiting on the maintainer" hidden>
              <div class="drawer-head">
                <span>Waiting on you</span>
                <button id="drawer-close" class="drawer-close" type="button" aria-label="Close decisions">×</button>
              </div>
              <div id="decision-list" class="drawer-list"></div>
            </aside>
          </div>
        </section>

        <section class="panel" aria-labelledby="backlog-title">
          <div class="panel-head">
            <div class="panel-head-left">
              <span class="eyebrow">Structured inventory</span>
              <h2 id="backlog-title">Backlog</h2>
            </div>
          </div>
          <div id="backlog" class="backlog-columns"></div>
          <div id="inventory-warning" class="warning-box" hidden></div>
        </section>

        <div id="optional-feeds" class="optional-feeds">
          <section id="gate-panel" class="panel optional-panel" aria-labelledby="gate-title" hidden>
            <div class="panel-head"><div class="panel-head-left"><span class="eyebrow">Validation</span><h2 id="gate-title">Deep-review gates</h2></div></div>
            <div id="gate-runs"></div>
          </section>
          <section id="workflow-panel" class="panel optional-panel" aria-labelledby="workflow-title" hidden>
            <div class="panel-head"><div class="panel-head-left"><span class="eyebrow">Orchestration</span><h2 id="workflow-title">Workflow runs</h2></div></div>
            <div id="workflow-runs"></div>
          </section>
          <section id="delivery-panel" class="panel optional-panel" aria-labelledby="delivery-title" hidden>
            <div class="panel-head"><div class="panel-head-left"><span class="eyebrow">Least privilege</span><h2 id="delivery-title">Deliveries</h2></div></div>
            <div id="deliveries"></div>
          </section>
        </div>
      </div>

      <aside class="panel artifacts-panel" aria-labelledby="artifacts-title">
        <div class="panel-head">
          <div class="panel-head-left">
            <span class="eyebrow">Read-only browser</span>
            <h2 id="artifacts-title">Artifacts</h2>
          </div>
        </div>
        <div id="artifacts" class="artifact-list"></div>
      </aside>
    </main>
  </div>

  <dialog id="detail-dialog">
    <div class="dialog-heading">
      <div>
        <h2 id="dialog-title">Detail</h2>
        <span id="dialog-subtitle" class="dialog-subtitle"></span>
      </div>
      <button id="dialog-close" class="ghost-btn" type="button">Close</button>
    </div>
    <div id="dialog-body"></div>
  </dialog>
  <span id="aria-live" class="sr-only" aria-live="polite"></span>
  <script src="/assets/app.js"></script>
</body>
</html>
