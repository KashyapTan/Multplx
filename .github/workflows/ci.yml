name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Install stable Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component clippy,rustfmt --no-self-update
          rustup default stable
          rustc --version
          cargo --version
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Build release workspace
        run: cargo build --release --workspace --locked

  rust-advisories:
    name: Rust dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo audit --deny warnings

  rust-coverage:
    name: Rust line coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust coverage tools
        run: |
          rustup component add llvm-tools-preview
          cargo install cargo-llvm-cov --version 0.8.7 --locked
      - name: Enforce workspace line coverage
        run: cargo llvm-cov --locked --workspace --all-targets --fail-under-lines 93

  # Deterministic proof that portable parallel shards + portable serial + Herdr
  # equal the complete tests/*.test.sh inventory with no missing or duplicates.
  test-coverage:
    name: Test coverage guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Prove complete regression partition
        run: bin/mx-test-run.sh --check-coverage

  # Two duration-balanced portable shards generated from the accepted timing
  # baseline. Both use the same resource scheduler as local --all.
  tests-portable-parallel-1:
    name: Behavior portable parallel 1
    runs-on: ubuntu-latest
    # Healthy shard wall is normally under five minutes; this cap preserves
    # margin for hosted-runner variance while remaining a bounded hang tripwire.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Rust runtime
        run: cargo build --release --workspace --locked
      - name: Run portable parallel shard 1
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mx-test"
          bin/mx-test-run.sh --lane portable-parallel-1 --jobs auto \
            --json "$RUNNER_TEMP/mx-test/mx-test-timing-portable-parallel-1.json"
      - name: Upload shard 1 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-test-timing-portable-parallel-1
          path: ${{ runner.temp }}/mx-test/mx-test-timing-portable-parallel-1.json
          if-no-files-found: warn

  tests-portable-parallel-2:
    name: Behavior portable parallel 2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Rust runtime
        run: cargo build --release --workspace --locked
      - name: Run portable parallel shard 2
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mx-test"
          bin/mx-test-run.sh --lane portable-parallel-2 --jobs auto \
            --json "$RUNNER_TEMP/mx-test/mx-test-timing-portable-parallel-2.json"
      - name: Upload shard 2 timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-test-timing-portable-parallel-2
          path: ${{ runner.temp }}/mx-test/mx-test-timing-portable-parallel-2.json
          if-no-files-found: warn

  # Global and live-harness remainder. The scheduler serializes global owners
  # and applies every declared conflict if this lane grows.
  tests-portable-serial:
    name: Behavior portable serial
    runs-on: ubuntu-latest
    # Measured serial remainder is ~13 min wall without Herdr. Cap is a hang
    # tripwire above observed p99 script cost and suite wall, not the expected
    # healthy end (interim 25m full-suite slack reduced after sharding).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Rust runtime
        run: cargo build --release --workspace --locked
      - name: Require tmux for e2e tests
        run: |
          set -eu
          command -v tmux >/dev/null || {
            echo "::error::tmux is required for real afk injection e2e coverage"
            exit 1
          }
          tmux -V
      - name: Exercise the Rust tmux shadow path
        env:
          MX_BACKEND_IMPLEMENTATION: rust
          MX_RUST_BIN: ${{ github.workspace }}/target/release/mx
        run: |
          tests/mx-backend.test.sh
          tests/mx-backend-tmux-smoke.test.sh
          tests/mx-actor-state.test.sh
          tests/mx-composer-ghost.test.sh
          tests/mx-tmux-submit-busy.test.sh
          tests/mx-daemon-liveness.test.sh
      - name: Run portable serial remainder
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mx-test"
          bin/mx-test-run.sh --lane portable-serial --jobs auto \
            --json "$RUNNER_TEMP/mx-test/mx-test-timing-portable-serial.json"
      - name: Upload portable serial timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-test-timing-portable-serial
          path: ${{ runner.temp }}/mx-test/mx-test-timing-portable-serial.json
          if-no-files-found: warn

  # Required real-Herdr lane: pinned install, serial real-herdr-gated family,
  # hard-fail on "skip: herdr not found". Starts on Linux x86_64; if a genuine
  # platform invariant fails (focus, cleanup, default-session tripwire), keep
  # the failure evidence and move the job to macOS rather than skip assertions.
  tests-herdr:
    name: Behavior tests (Herdr)
    runs-on: ubuntu-latest
    env:
      MX_BACKEND_IMPLEMENTATION: rust
      MX_HERDR_TOOLS_IMPLEMENTATION: rust
      MX_RUST_BIN: ${{ github.workspace }}/target/release/mx
    # Real Herdr is slower than the portable suite; this is a hang tripwire,
    # not the expected healthy end of the lane (estimate 15-40 min first cut).
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Build Rust runtime
        run: cargo build --release --workspace --locked
      - name: Require tools for real Herdr
        run: |
          set -eu
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          command -v python3 >/dev/null || { echo "::error::python3 is required"; exit 1; }
          command -v curl >/dev/null || { echo "::error::curl is required"; exit 1; }
          command -v tar >/dev/null || { echo "::error::tar is required"; exit 1; }
          jq --version
          python3 --version
      - name: Install pinned Herdr
        run: |
          set -eu
          bin/mx-install-herdr.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Install pinned Treehouse
        run: |
          set -eu
          # Several real-herdr-gated E2E scripts require treehouse for spawn
          # worktree acquisition (presentation, workspace-per-home, autodetect).
          bin/mx-install-treehouse.sh "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Assert Herdr pin and protocol floor
        run: |
          set -eu
          command -v herdr >/dev/null || { echo "::error::herdr not on PATH after install"; exit 1; }
          command -v treehouse >/dev/null || { echo "::error::treehouse not on PATH after install"; exit 1; }
          herdr --version
          treehouse --version
          status=$(herdr status --json)
          printf '%s\n' "$status"
          version=$(printf '%s' "$status" | jq -r '.client.version // empty')
          protocol=$(printf '%s' "$status" | jq -r '.client.protocol // empty')
          [ "$version" = "0.7.4" ] || {
            echo "::error::expected exact Herdr pin 0.7.4, got ${version:-<empty>}"
            exit 1
          }
          case "$protocol" in
            ''|*[!0-9]*) echo "::error::could not read client protocol"; exit 1 ;;
          esac
          [ "$protocol" -ge 16 ] || {
            echo "::error::herdr protocol $protocol is below the required floor 16"
            exit 1
          }
      - name: Start default Herdr session for system-state tripwire
        run: |
          set -eu
          # Lab provision requires exactly one running default session so the
          # default-session tripwire can arm. Start it headless; never use it
          # for lab work (tests still refuse default and use mx-lab-* only).
          mkdir -p "$RUNNER_TEMP/mx-herdr"
          nohup herdr server >"$RUNNER_TEMP/mx-herdr/default-server.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/mx-herdr/default-server.pid"
          attempt=0
          while [ "$attempt" -lt 150 ]; do
            running=$(herdr status --json 2>/dev/null | jq -r '.server.running // false' || echo false)
            if [ "$running" = true ]; then
              herdr session list --json | jq -e '
                [.sessions[]? | select(.default == true and .name == "default" and .running == true)]
                | length == 1
              ' >/dev/null
              echo "default Herdr session is running"
              exit 0
            fi
            sleep 0.2
            attempt=$((attempt + 1))
          done
          echo "::error::default Herdr server did not become ready"
          cat "$RUNNER_TEMP/mx-herdr/default-server.log" || true
          exit 1
      - name: Snapshot pre-suite Herdr sessions
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mx-herdr"
          bin/mx-herdr-ci-cleanup.sh snapshot "$RUNNER_TEMP/mx-herdr/sessions-before.json"
      - name: Run real-Herdr family (serial, required)
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mx-test"
          # Serial only. Fail if any script reports herdr not found. Live
          # harness credential tests stay outside this family (opt-in env only).
          bin/mx-test-run.sh --family real-herdr-gated \
            --fail-on-gate-skip 'herdr not found' \
            --json "$RUNNER_TEMP/mx-test/mx-test-timing-herdr.json"
      - name: Cleanup job-owned Herdr lab sessions
        if: always()
        run: |
          set -eu
          bin/mx-herdr-ci-cleanup.sh teardown "$RUNNER_TEMP/mx-herdr/sessions-before.json" || {
            echo "::warning::lab session cleanup reported a problem; see logs"
            # Surface diagnostics without weakening the suite result above.
            herdr session list --json || true
            exit 1
          }
      - name: Upload Herdr timing and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-test-timing-herdr
          path: |
            ${{ runner.temp }}/mx-test/mx-test-timing-herdr.json
            ${{ runner.temp }}/mx-herdr/sessions-before.json
            ${{ runner.temp }}/mx-herdr/default-server.log
          if-no-files-found: warn

  # Aggregate per-lane timing into one summary artifact for critical-path review.
  tests-timing-aggregate:
    name: Behavior timing aggregate
    runs-on: ubuntu-latest
    needs:
      - tests-portable-parallel-1
      - tests-portable-parallel-2
      - tests-portable-serial
      - tests-herdr
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Download lane timing artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mx-test-timing-*
          path: ${{ runner.temp }}/mx-test-aggregate
          merge-multiple: true
      - name: Build aggregate timing summary
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/mx-test"
          shopt -s nullglob
          inputs=("$RUNNER_TEMP"/mx-test-aggregate/mx-test-timing-*.json)
          if [ "${#inputs[@]}" -eq 0 ]; then
            echo "::warning::no per-lane timing JSON found to aggregate"
            exit 0
          fi
          bin/mx-test-run.sh --aggregate-json \
            "$RUNNER_TEMP/mx-test/mx-test-timing-aggregate.json" \
            "${inputs[@]}"
      - name: Upload aggregate timing artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mx-test-timing-aggregate
          path: ${{ runner.temp }}/mx-test/mx-test-timing-aggregate.json
          if-no-files-found: warn

  macos-stock-bash:
    name: Stock macOS Bash snapshot compatibility
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Run snapshot consumers with stock Bash
        shell: /bin/bash {0}
        env:
          PATH: /bin:/usr/bin:/usr/sbin:/sbin:/usr/local/bin:/opt/homebrew/bin
          MX_LOCAL_STATE_IMPLEMENTATION: legacy
        run: |
          set -eu
          case "$BASH_VERSION" in
            3.2.57*) ;;
            *) echo "::error::expected stock macOS Bash 3.2.57, got $BASH_VERSION"; exit 1 ;;
          esac
          /bin/bash --version | head -1
          command -v jq >/dev/null || { echo "::error::jq is required"; exit 1; }
          /bin/bash -n bin/mx-system-snapshot.sh

          snapshot_output=$(/bin/bash tests/mx-system-snapshot-view.test.sh)
          printf '%s\n' "$snapshot_output"
          snapshot_count=$(printf '%s\n' "$snapshot_output" | grep -c '^ok - ')
          [ "$snapshot_count" -eq 17 ] || {
            echo "::error::expected 17 snapshot/system-view tests, got $snapshot_count"
            exit 1
          }

          status_output=$(
            /bin/bash tests/mx-status-snapshot-projection-reconciliation.test.sh
            /bin/bash tests/mx-status-snapshot-landed-bounds.test.sh
            /bin/bash tests/mx-status-snapshot-catchup-forge.test.sh
          )
          printf '%s\n' "$status_output"
          status_count=$(printf '%s\n' "$status_output" | grep -c '^ok - ')
          [ "$status_count" -eq 42 ] || {
            echo "::error::expected 42 Catchup tests, got $status_count"
            exit 1
          }

  invariants:
    name: Repo invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Symlinks must stay intact
        run: |
          set -eu
          [ "$(readlink .claude/skills)" = "../.agents/skills" ] || { echo "::error::.claude/skills must be a symlink to ../.agents/skills"; exit 1; }
      - name: Personal system paths must not be tracked
        run: |
          set -eu
          tracked=$(git ls-files -- data state config projects)
          if [ -n "$tracked" ]; then
            echo "::error::Personal system paths are tracked in git:"
            printf '%s\n' "$tracked"
            exit 1
          fi
