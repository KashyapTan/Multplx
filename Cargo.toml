[workspace]
members = [
  "crates/multplx-backend",
  "crates/multplx-cli",
  "crates/multplx-core",
  "crates/multplx-domain",
  "crates/multplx-services",
  "crates/multplx-test-support",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/KashyapTan/Multplx"

[workspace.dependencies]
clap = { version = "4.5.45", features = ["derive"] }
regex = "1.11.1"
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["preserve_order"] }
sha2 = "0.10.9"
tempfile = "3.20.0"
thiserror = "2.0.16"
time = { version = "0.3.41", features = ["formatting", "parsing"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
